name: 💡 Feature Request
description: Suggest an idea or enhancement for Fluffy
title: "💡 "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new feature or improvement.
  - type: input
    id: fluffy_version
    attributes:
      label: 🔢 Fluffy version
      description: Release version (for example 0.2.0) or commit hash
  - type: dropdown
    id: area
    attributes:
      label: 📂 Area
      options:
        - Widgets
        - Layout
        - Rendering / NanoVG
        - Windowing / GLFW backend
        - Theming / YAML
        - WebView
        - Documentation / examples
        - Build / CMake
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: ❓ What problem does this solve?
      placeholder: Describe the use case or pain point...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 💭 Proposed solution
      placeholder: Describe the feature or change you want...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives considered
      placeholder: Any workarounds or alternative approaches?
  - type: dropdown
    id: breaking
    attributes:
      label: ⚠️ Breaking change?
      options:
        - "No"
        - "Yes"
        - Unsure
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
